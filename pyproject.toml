[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "samf-osteosarcoma"
version = "1.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.2.2",
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.2.1",
  "scikit-learn==1.4.1.post1",
  "lifelines==0.27.8",
  "omegaconf==2.3.0",
  "h5py==3.10.0",
  "Pillow==10.2.0",
  "openslide-python==1.3.1",
  "timm==0.9.16",
  "einops==0.7.0",
  "pyyaml==6.0.1"
]

[project.scripts]
samf-train = "samf_osteosarcoma.cli.train:main"
samf-evaluate = "samf_osteosarcoma.cli.evaluate:main"
samf-prepare = "samf_osteosarcoma.cli.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disable_error_code = ["no-any-return", "no-untyped-call"]
